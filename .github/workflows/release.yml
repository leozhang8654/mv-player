# 构建 macOS(Apple 芯片 / Intel)与 Windows 安装包,并发布到 GitHub Releases。
# 触发:推送 v* 标签(如 v1.0.0),或在 Actions 页面手动运行。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号(如 1.0.0)"
        required: true
      publish:
        description: "构建后发布到 Releases(不勾选 = 只构建试跑,产物在本次运行的 Artifacts 里)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  macos:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple 芯片(arm64)
          - runner: macos-15-intel    # Intel(x86_64)
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHON=python packaging/build_macos.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.runner }}
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 Inno Setup(没有的话)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - shell: pwsh
        run: packaging\build_windows.ps1 -Version $env:VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  release:
    needs: [macos, windows]
    # 所有平台都构建成功才发布:README 的「下载最新版」链接依赖每个安装包都在最新版本里。
    # 某个平台偶发失败时,在 Actions 页面「Re-run failed jobs」即可。
    if: ${{ github.event_name == 'push' || inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION#v}"
          NOTES=".github/release-notes/${TAG}.md"
          [ -f "$NOTES" ] || NOTES=/dev/null
          ls -la dist
          (cd dist && sha256sum * > SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "MV 播放器 ${TAG}" --notes-file "$NOTES"
          fi
